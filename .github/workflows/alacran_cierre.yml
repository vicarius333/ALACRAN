name: ALACRAN - Cierre Extracción XML

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cierre:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ALACRAN
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Descargar y extraer XML
        run: |
          python 03_EJECUCION/ALACRAN_DOWNLOAD_XML.py \
            BIBLIA/FUENTE_XML_MANIFIESTO.json \
            BIBLIA/input/HebrewBible.xml
          mkdir -p BIBLIA/output
          python 03_EJECUCION/ALACRAN_EXTRACTOR_XML.py \
            BIBLIA/input/HebrewBible.xml \
            BIBLIA/input/XML_MAPPING.json \
            BIBLIA/output/DATOS_BIBLICOS_NORMALIZADOS.jsonl

      - name: Validar extracción
        run: |
          python 04_VALIDACION/ALACRAN_VALIDAR_EXTRACCION.py \
            BIBLIA/output/DATOS_BIBLICOS_NORMALIZADOS.jsonl \
            > BIBLIA/output/VALIDACION_RESULTADO.json

      - name: Ejecutar cierre 05
        run: |
          python 05_CIERRE/ALACRAN_CIERRE.py \
            BIBLIA/output/VALIDACION_RESULTADO.json \
            BIBLIA/output/DATOS_BIBLICOS_NORMALIZADOS.jsonl \
            BIBLIA/input/XML_MAPPING.json \
            BIBLIA/FUENTE_XML_MANIFIESTO.json \
            BIBLIA/output/ALACRAN_CIERRE_EXTRACCION_V1.json

      - name: Publicar cierre
        uses: actions/upload-artifact@v4
        with:
          name: ALACRAN-CIERRE-V1
          path: BIBLIA/output/ALACRAN_CIERRE_EXTRACCION_V1.json
          if-no-files-found: error
          retention-days: 14
