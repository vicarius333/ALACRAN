name: ALACRAN - Transición

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transicion:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ALACRAN
        uses: actions/checkout@v4

      - name: Preparar entrada de cierre
        run: |
          python 03_EJECUCION/ALACRAN_DOWNLOAD_XML.py \
            BIBLIA/FUENTE_XML_MANIFIESTO.json \
            BIBLIA/input/HebrewBible.xml
          mkdir -p BIBLIA/output
          python 03_EJECUCION/ALACRAN_EXTRACTOR_XML.py \
            BIBLIA/input/HebrewBible.xml \
            BIBLIA/input/XML_MAPPING.json \
            BIBLIA/output/DATOS_BIBLICOS_NORMALIZADOS.jsonl
          python 04_VALIDACION/ALACRAN_VALIDAR_EXTRACCION.py \
            BIBLIA/output/DATOS_BIBLICOS_NORMALIZADOS.jsonl \
            > BIBLIA/output/VALIDACION_RESULTADO.json
          python 05_CIERRE/ALACRAN_CIERRE.py \
            BIBLIA/output/VALIDACION_RESULTADO.json \
            BIBLIA/output/DATOS_BIBLICOS_NORMALIZADOS.jsonl \
            BIBLIA/input/XML_MAPPING.json \
            BIBLIA/FUENTE_XML_MANIFIESTO.json \
            BIBLIA/output/ALACRAN_CIERRE_EXTRACCION_V1.json

      - name: Ejecutar transición
        run: |
          mkdir -p BIBLIA/output
          touch BIBLIA/output/HALLAZGOS.jsonl
          python 06_TRANSICION/ALACRAN_TRANSICION.py \
            BIBLIA/output/ALACRAN_CIERRE_EXTRACCION_V1.json \
            BIBLIA/output/HALLAZGOS.jsonl \
            BIBLIA/output/ALACRAN_TRANSICION_RESULTADO_V1.json

      - name: Publicar transición
        uses: actions/upload-artifact@v4
        with:
          name: ALACRAN-TRANSICION-V1
          path: BIBLIA/output/ALACRAN_TRANSICION_RESULTADO_V1.json
          if-no-files-found: error
          retention-days: 14
